<!DOCTYPE html>
<html lang="en" data-page="index">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>SPIM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui'],serif:['Instrument Serif','serif'],mono:['JetBrains Mono','ui-monospace','monospace']}}}}</script>
<style>
  :root{color-scheme:dark}
  html{scroll-behavior:smooth}
  :focus-visible{outline:2px solid #22d3ee; outline-offset:2px}
  ::selection{background:#22d3ee; color:#000}
  @keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,211,153,0.4)}50%{transform:scale(1.02);box-shadow:0 0 0 14px rgba(52,211,153,0)}}
  .breathe{animation:breathe 2.4s ease-in-out infinite}
</style>
</head>
<body class="bg-[#07080A] text-zinc-100 antialiased">
  <header class="max-w-[880px] mx-auto px-6 pt-8 pb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-md bg-cyan-400 text-black grid place-items-center font-black text-[12px]">S</div>
      <span class="font-semibold tracking-tight">SPIM</span>
    </div>
    <div class="flex gap-1 rounded-full border border-zinc-800 p-1 text-[12px]">
      <button id="tabBeam" class="px-5 py-1.5 rounded-full bg-cyan-400 text-black font-semibold">Beam</button>
      <button id="tabCatch" class="px-5 py-1.5 rounded-full text-zinc-400">Catch</button>
    </div>
  </header>

  <main class="max-w-[880px] mx-auto px-6">
    <section id="panelBeam" class="mt-4">
      <div class="rounded-2xl border border-zinc-800 bg-[#0F1014] overflow-hidden">
        <textarea id="note" rows="8" class="w-full bg-transparent px-6 pt-6 pb-3 outline-none resize-none text-[17px] leading-relaxed placeholder:text-zinc-600" placeholder="Type something to beam to the room..."></textarea>
        <div class="px-6 pb-6">
          <div class="flex items-center justify-between text-[12px] text-zinc-500">
            <span id="charCount">0 chars</span>
            <span id="timePill">~0.0s chirp</span>
          </div>
          <button id="beamBtn" class="mt-5 w-full py-5 rounded-full bg-cyan-400 text-black font-semibold text-[16px] hover:brightness-110 active:scale-[0.99] transition">Beam to Room</button>
        </div>
      </div>
    </section>

    <section id="panelCatch" class="hidden mt-4">
      <div class="rounded-2xl border border-zinc-800 bg-[#0F1014] p-8 text-center">
        <button id="listenBtn" class="mx-auto w-48 h-48 rounded-full bg-emerald-400 text-black font-semibold text-[17px] breathe">Tap to Listen</button>
        <div id="listenStatus" class="mt-5 text-[14px] text-zinc-400">Listening for nearby drops...</div>
        <div class="mt-8 max-w-[520px] mx-auto text-left">
          <div class="text-[12px] text-zinc-500 mb-2">Drop sound</div>
          <div class="flex flex-col sm:flex-row gap-2">
            <select id="dropSoundSel" class="flex-1 bg-[#07080A] border border-zinc-800 rounded-lg px-3 py-2 text-[13px]">
              <option value="pop">Pop</option>
              <option value="ding">Ding</option>
              <option value="whoosh">Whoosh</option>
            </select>
            <input type="file" id="customDrop" accept="audio/*" class="text-[12px] text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:bg-zinc-800 file:text-zinc-200">
          </div>
        </div>
        <div id="noteCard" class="hidden mt-8 max-w-[520px] mx-auto text-left rounded-2xl border border-emerald-400/40 bg-emerald-400/5 p-6">
          <div class="text-[12px] uppercase tracking-[0.2em] text-emerald-400 mb-3">Caught</div>
          <div id="caughtText" class="text-[16px] leading-relaxed whitespace-pre-wrap"></div>
          <div class="mt-5 flex flex-wrap gap-2">
            <button id="copyBtn" class="px-4 py-2 rounded-full border border-zinc-700 text-[13px] hover:bg-zinc-900">Copy Text</button>
            <button id="saveBtn" class="px-4 py-2 rounded-full border border-zinc-700 text-[13px] hover:bg-zinc-900">Save .spim</button>
          </div>
        </div>
      </div>
    </section>
  </main>

<script>
const SAMPLE_RATE=48000,SYMBOL_SAMPLES=480,FREQ_BIT0=21000,FREQ_BIT1=23000,PREAMBLE_LEN=24,MAGIC=0x53,MAX_PAYLOAD=4096;
function crc8(d){let c=0;for(let i=0;i<d.length;i++){c^=d[i];for(let j=0;j<8;j++){if(c&0x80)c=((c<<1)^0x07)&0xFF;else c=(c<<1)&0xFF}}return c&0xFF}
function crc16(d){let c=0xFFFF;for(let i=0;i<d.length;i++){c^=(d[i]<<8);for(let j=0;j<8;j++){if(c&0x8000)c=((c<<1)^0x1021)&0xFFFF;else c=(c<<1)&0xFFFF}}return c&0xFFFF}
function encodeFrame(bytes){
  if(bytes.length>MAX_PAYLOAD)throw new Error('too big');
  const bits=[];
  for(let i=0;i<PREAMBLE_LEN;i++) bits.push(i%2===0);
  const len=bytes.length;
  const header=[MAGIC,(len>>8)&0xFF,len&0xFF,crc8([MAGIC,(len>>8)&0xFF,len&0xFF])];
  const framed=[...header,...bytes,((crc16(bytes)>>8)&0xFF),crc16(bytes)&0xFF];
  for(let i=0;i<framed.length;i++){const b=framed[i]&0xFF;for(let j=7;j>=0;j--) bits.push(((b>>j)&1)===1)}
  const out=new Float32Array(bits.length*SYMBOL_SAMPLES);
  let phase=0,n=0;const twoPi=2*Math.PI;
  for(let bi=0;bi<bits.length;bi++){
    const f=bits[bi]?FREQ_BIT1:FREQ_BIT0;
    for(let i=0;i<SYMBOL_SAMPLES;i++){out[n++]=Math.sin(phase);phase+=twoPi*f/SAMPLE_RATE}
    phase=((phase%twoPi)+twoPi)%twoPi;
  }
  const taper=Math.floor(SAMPLE_RATE*0.002);
  for(let i=0;i<Math.min(taper,out.length);i++){const t=Math.PI*i/taper;const w=(1-Math.cos(t))*0.5;out[i]*=w}
  for(let i=0;i<Math.min(taper,out.length);i++){const idx=out.length-1-i;const t=Math.PI*i/taper;const w=(1-Math.cos(t))*0.5;out[idx]*=w}
  return out;
}
function goertzel(pwr,f){let s1=0,s2=0;const c=2*Math.cos(2*Math.PI*f/SAMPLE_RATE);for(let i=0;i<pwr.length;i++){const s0=pwr[i]+c*s1-s2;s2=s1;s1=s0}return s1*s1-c*s1*s2+s2*s2}
function symbolBit(s){return goertzel(s,FREQ_BIT1)>goertzel(s,FREQ_BIT0)}
function decodeSamples(samples){
  const n=Math.floor(samples.length/SYMBOL_SAMPLES);if(n<PREAMBLE_LEN+20)return null;
  const pre=[];for(let i=0;i<PREAMBLE_LEN;i++) pre.push(i%2===0);
  for(let off=0;off<SYMBOL_SAMPLES;off+=16){
    const ns=Math.floor((samples.length-off)/SYMBOL_SAMPLES);if(ns<PREAMBLE_LEN+10)continue;
    const bits=new Array(ns).fill(false);
    const sym=new Float32Array(SYMBOL_SAMPLES);
    for(let s=0;s<ns;s++){const st=off+s*SYMBOL_SAMPLES;for(let i=0;i<SYMBOL_SAMPLES;i++) sym[i]=samples[st+i];bits[s]=symbolBit(sym)}
    for(let i=0;i<ns-PREAMBLE_LEN+1;i++){let c=0;for(let k=0;k<PREAMBLE_LEN;k++)if(bits[i+k]==pre[k])c++;if(c>=22){
      let p=i+PREAMBLE_LEN;let fbytes=Math.floor((ns-p)/8);let fbits=[];for(let j=p;j<p+fbytes*8;j++)fbits.push(bits[j]);
      const framed=[];for(let x=0;x<fbits.length;x+=8){let b=0;for(let y=0;y<8;y++)b=(b<<1)|(fbits[x+y]?1:0);framed.push(b&0xFF)}
      if(framed.length<6||framed[0]!=MAGIC)return null;
      if(crc8([framed[0],framed[1],framed[2]])!=framed[3])return null;
      const len=(framed[1]<<8)|framed[2];if(len>MAX_PAYLOAD||framed.length<4+len+2)return null;
      const payload=framed.slice(4,4+len);const crx=(framed[4+len]<<8)|framed[4+len+1];if(crx!=crc16(payload))return null;return new Uint8Array(payload);
    }}
  }return null;
}

const tabBeam=document.getElementById('tabBeam'),tabCatch=document.getElementById('tabCatch'),panelBeam=document.getElementById('panelBeam'),panelCatch=document.getElementById('panelCatch');
tabBeam.onclick=()=>{tabBeam.className='px-5 py-1.5 rounded-full bg-cyan-400 text-black font-semibold';tabCatch.className='px-5 py-1.5 rounded-full text-zinc-400';panelBeam.classList.remove('hidden');panelCatch.classList.add('hidden');}
tabCatch.onclick=()=>{tabCatch.className='px-5 py-1.5 rounded-full bg-emerald-400 text-black font-semibold';tabBeam.className='px-5 py-1.5 rounded-full text-zinc-400';panelCatch.classList.remove('hidden');panelBeam.classList.add('hidden');}

const note=document.getElementById('note'),charCount=document.getElementById('charCount'),timePill=document.getElementById('timePill'),beamBtn=document.getElementById('beamBtn');
note.oninput=()=>{const len=note.value.length;charCount.textContent=len+' chars';const secs=(len*8 + PREAMBLE_LEN*8 + (4+2)*8)/100.0;timePill.textContent='~'+secs.toFixed(1)+'s chirp';};note.oninput();
beamBtn.onclick=async()=>{
  const bytes=new TextEncoder().encode(note.value);
  const samples=encodeFrame(bytes);
  const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:SAMPLE_RATE});
  const buf=ctx.createBuffer(1,samples.length,SAMPLE_RATE);buf.getChannelData(0).set(samples);
  const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start();
  beamBtn.disabled=true;beamBtn.textContent='Beaming...';
  src.onended=()=>{beamBtn.disabled=false;beamBtn.textContent='Beam to Room';try{ctx.close();}catch(e){}};
};

const listenBtn=document.getElementById('listenBtn'),listenStatus=document.getElementById('listenStatus'),noteCard=document.getElementById('noteCard'),caughtText=document.getElementById('caughtText'),copyBtn=document.getElementById('copyBtn'),saveBtn=document.getElementById('saveBtn');
let listening=false,audioCtx=null,proc=null,src=null,stream=null,customDropBuf=null;
let ringBuf=null,ringPos=0,ringLen=0,lastDecodeAt=0,catchCount=0,lastKey='',lastKeyAt=0;

// Continuous receiver tuning. The mic stays hot after a catch; only the
// decode window is cleared, so the next drop needs no tap.
const RING_SECONDS=12;
const WINDOW_SECONDS=8;
const DECODE_MIN_INTERVAL_MS=120;
const RMS_GATE=0.010;

document.getElementById('customDrop').onchange=async(e)=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();const ab=await f.arrayBuffer();customDropBuf=await ctx.decodeAudioData(ab);await ctx.close();}catch(err){}};
function playDrop(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();
    if(customDropBuf){const s=ctx.createBufferSource();s.buffer=customDropBuf;s.connect(ctx.destination);s.start();setTimeout(()=>{try{ctx.close();}catch(e){}},2000);return;}
    const sel=document.getElementById('dropSoundSel').value;
    if(sel==='ding'){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=1046;o.type='sine';o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.6);o.start();o.stop(ctx.currentTime+0.6);}
    else if(sel==='whoosh'){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(400,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(1200,ctx.currentTime+0.18);o.type='sawtooth';o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+0.05);g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.28);o.start();o.stop(ctx.currentTime+0.28);}
    else {const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.type='triangle';o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.28,ctx.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.22);o.start();o.stop(ctx.currentTime+0.22);}
    setTimeout(()=>{try{ctx.close();}catch(e){}},800);
  }catch(e){}
}

function clearRing(){ringPos=0;ringLen=0;lastDecodeAt=0;}
function rmsOf(samples){let e=0;for(let i=0;i<samples.length;i++)e+=samples[i]*samples[i];return Math.sqrt(e/samples.length);}

// Copy the newest `maxLen` samples out of the circular buffer, oldest first.
function snapshotWindow(maxLen){
  const len=Math.min(ringLen,maxLen);
  const out=new Float32Array(len);
  const n=ringBuf.length;
  const start=((ringPos-len)%n+n)%n;
  for(let i=0;i<len;i++) out[i]=ringBuf[(start+i)%n];
  return out;
}

function handleCaught(bytes){
  const txt=new TextDecoder().decode(bytes);
  const now=performance.now();
  // Ignore the same frame arriving twice (echo / replay within 2 s).
  if(txt===lastKey && now-lastKeyAt<2000) return;
  lastKey=txt; lastKeyAt=now;
  catchCount++;
  caughtText.textContent=txt;
  noteCard.classList.remove('hidden');
  listenStatus.textContent='Caught '+catchCount+' · still listening…';
  playDrop();
  // Consume the message and keep the mic armed for the next one.
  clearRing();
}

async function stopListening(){
  listening=false;
  listenBtn.classList.add('breathe');
  listenBtn.textContent='Tap to Listen';
  try{if(proc)proc.disconnect();if(src)src.disconnect();}catch(e){}
  try{if(stream){stream.getTracks().forEach(t=>t.stop());}}catch(e){}
  try{if(audioCtx){await audioCtx.close();}}catch(e){}
  proc=null;src=null;stream=null;audioCtx=null;
  ringBuf=null;clearRing();
}

listenBtn.onclick=async()=>{
  if(listening){ await stopListening(); return; }
  listening=true;
  catchCount=0;lastKey='';lastKeyAt=0;
  ringBuf=new Float32Array(SAMPLE_RATE*RING_SECONDS);clearRing();
  listenBtn.classList.remove('breathe');
  listenBtn.textContent='Listening...';
  listenStatus.textContent='Listening for nearby drops...';
  noteCard.classList.add('hidden');
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    audioCtx=new Ctx({sampleRate:SAMPLE_RATE});
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    src=audioCtx.createMediaStreamSource(stream);
    proc=audioCtx.createScriptProcessor(2048,1,1);
    const zero=audioCtx.createGain();zero.gain.value=0;
    proc.onaudioprocess=e=>{
      if(!listening)return;
      const ch=e.inputBuffer.getChannelData(0);
      for(let i=0;i<ch.length;i++){
        ringBuf[ringPos]=ch[i];
        ringPos=(ringPos+1)%ringBuf.length;
        if(ringLen<ringBuf.length) ringLen++;
      }
      if(ringLen<SYMBOL_SAMPLES*(PREAMBLE_LEN+24)) return;

      // Throttle + cheap gate: a decode over the window is expensive, and
      // silence can never contain a preamble.
      const now=performance.now();
      if(now-lastDecodeAt<DECODE_MIN_INTERVAL_MS) return;
      lastDecodeAt=now;
      if(rmsOf(ch)<RMS_GATE) return;

      const res=decodeSamples(snapshotWindow(SAMPLE_RATE*WINDOW_SECONDS));
      if(res) handleCaught(res);
    };
    src.connect(proc);proc.connect(zero);zero.connect(audioCtx.destination);
  }catch(err){
    await stopListening();
    listenStatus.textContent='Mic error';
  }
};
copyBtn.onclick=()=>{try{navigator.clipboard.writeText(caughtText.textContent);copyBtn.textContent='Copied';setTimeout(()=>copyBtn.textContent='Copy Text',1000);}catch(e){}};
saveBtn.onclick=()=>{
  const blob=new Blob([caughtText.textContent],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='spim-note.txt';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
</script>
</body>
</html>
