<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Log in — Share</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui'],mono:['JetBrains Mono','monospace']}}}}</script>
</head>
<body data-page="login" class="bg-[#fdfaf6] text-zinc-900 antialiased">
<nav class="max-w-[720px] mx-auto px-6 h-[64px] flex items-center justify-between">
  <a href="/" class="flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-zinc-900 text-white grid place-items-center font-bold text-[13px]">S</div>
    <span class="font-bold tracking-tight">SPIM</span>
  </a>
  <div id="navPublic" class="flex items-center gap-5 text-[13px]">
    <a href="/use-cases.html" class="hidden sm:inline hover:underline underline-offset-4">Use Cases</a>
    <a href="/why.html" class="hidden sm:inline hover:underline underline-offset-4">Why</a>
    <a href="/about.html" class="hidden sm:inline hover:underline underline-offset-4">About</a>
    <a href="/support.html" class="hover:underline underline-offset-4">Support</a>
    <a href="/login.html" class="px-4 py-2 rounded-full bg-zinc-900 text-white font-semibold hover:bg-black">Log in</a>
  </div>
  <div id="navAuthed" class="hidden items-center gap-5 text-[13px] font-medium">
    <a href="/" class="hover:underline">Home</a>
    <a href="/account.html" class="hover:underline">Dock</a>
    <a href="/account.html" class="hover:underline">Connections</a>
    <a href="/images.html" class="hover:underline">Images</a>
    <a href="/account.html" class="hover:underline">API</a>
    <button id="avatarBtn" onclick="toggleAvatarMenu()" class="w-8 h-8 rounded-full bg-zinc-900 text-white grid place-items-center font-bold">A</button>
    <div id="avatarMenu" class="hidden absolute right-6 top-[64px] w-[240px] rounded-xl bg-white border border-zinc-200 shadow-lg p-2 text-[13px]">
      <div id="avatarEmail" class="px-3 py-2 text-zinc-500 truncate">—</div>
      <a href="/account.html" class="block px-3 py-2 hover:bg-zinc-50 rounded-lg">Account</a>
      <button onclick="doSignOut()" class="w-full text-left px-3 py-2 hover:bg-zinc-50 rounded-lg">Sign out</button>
    </div>
  </div>
  <button onclick="document.getElementById('mnav').classList.toggle('hidden')" class="sm:hidden w-8 h-8 grid place-items-center" aria-label="Menu">☰</button>
</nav>
<div id="mnav" class="hidden max-w-[720px] mx-auto px-6 py-3 border-t border-zinc-100 text-[14px] space-y-2">
  <div id="mnavPublic"><a href="/use-cases.html" class="block py-1">Use Cases</a><a href="/why.html" class="block py-1">Why</a><a href="/about.html" class="block py-1">About</a><a href="/support.html" class="block py-1">Support</a></div>
  <div id="mnavAuthed" class="hidden"><a href="/account.html" class="block py-1">Dock</a><a href="/account.html" class="block py-1">Connections</a></div>
</div>
<div class="max-w-[480px] mx-auto px-6 py-12">
  <h1 class="text-[32px] font-black">Log in</h1>
  <p class="font-mono text-[13px] text-zinc-500 mt-2">Welcome back.</p>
  <form id="form" class="mt-8 space-y-4">
    <div>
      <label class="font-mono text-[11px] font-bold">Email</label>
      <input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-full border-2 border-zinc-900 px-4 py-3 font-mono text-[13px]">
    </div>
    <div>
      <label class="font-mono text-[11px] font-bold">Password</label>
      <input id="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-full border-2 border-zinc-900 px-4 py-3 font-mono text-[13px]">
    </div>
    <button type="submit" class="w-full py-4 rounded-full bg-zinc-900 text-white font-black text-[15px]">Log in →</button>
    <p id="err" class="hidden font-mono text-[11px] text-red-600"></p>
  </form>
  <p class="mt-6 font-mono text-[11px] text-zinc-500">No account? <a href="/create-account.html" class="underline font-bold">Create one</a></p>
</div>
<script src="/js/supabaseClient.js"></script>
<script src="/js/entitlements.js"></script>
<script>
function toggleAvatarMenu(){document.getElementById('avatarMenu').classList.toggle('hidden')}
async function doSignOut(){await window.supabase.auth.signOut(); location.href='/'}
document.addEventListener('click',e=>{const m=document.getElementById('avatarMenu'),b=document.getElementById('avatarBtn'); if(m&&b&&!m.contains(e.target)&&!b.contains(e.target)) m.classList.add('hidden')});
async function initAuth(){
  const {data:{session}}=await window.supabase.auth.getSession();
  const a=!!session;
  const el=(id)=>document.getElementById(id);
  if(el('navPublic')){el('navPublic').classList.toggle('hidden',a); el('navPublic').classList.toggle('flex',!a);}
  if(el('navAuthed')){el('navAuthed').classList.toggle('hidden',!a); el('navAuthed').classList.toggle('flex',a);}
  if(el('mnavPublic')) el('mnavPublic').classList.toggle('hidden',a);
  if(el('mnavAuthed')) el('mnavAuthed').classList.toggle('hidden',!a);
  if(a&&el('avatarBtn')) el('avatarBtn').textContent=session.user.email[0].toUpperCase();
  if(a&&el('avatarEmail')) el('avatarEmail').textContent=session.user.email;
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initAuth); else initAuth();
</script>
<script>
const _form=document.getElementById('form'); if(_form) _form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.classList.add('hidden');
  const { data, error } = await window.supabase.auth.signInWithPassword({email, password});
  if(error){ err.textContent=error.message; err.classList.remove('hidden'); } else { location.href='/account.html'; }
});
</script>
</body>
</html>
