name = "spim-site"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

[vars]
SPIM_ORIGIN = "https://similar-speeches-marine-occasion.trycloudflare.com"
# KV origin is no longer used — hard-coded in functions to avoid KV auth issues
# SPIM_UPDATE_TOKEN is a Pages secret, set with:
#   wrangler pages secret put SPIM_UPDATE_TOKEN --project-name=spim-site
# Never put it back in this file: everything in the deploy tree is public.

[[kv_namespaces]]
binding = "SPIM_KV"
id = "0df622028d884c439f064e3673f4bfe9"

# Single-view burn registry (see migrations/0001_capsule_burn.sql).
# D1 is the authority for "opened once": its writes serialise, so the insert in
# functions/capsules/[id]/consume.js is the fence. KV alone cannot do this.
#
# Provision before the code that needs it goes live, in this order:
#   npx wrangler d1 create spim-burn
#   npx wrangler d1 execute spim-burn --remote --file=migrations/0001_capsule_burn.sql
# then uncomment and paste the database_id from the create output.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "spim-burn"
# database_id = "<paste id>"

